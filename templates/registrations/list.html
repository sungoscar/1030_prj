<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ activity.title }}｜活動報名清單</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f7fb; color: #182b46; font-family: system-ui, "Microsoft JhengHei", sans-serif; line-height: 1.6; }
        main { max-width: 960px; margin: 48px auto; padding: 0 20px; }
        .label { color: #405f83; font-size: 0.95rem; margin: 0 0 8px; }
        h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); margin: 0 0 24px; overflow-wrap: anywhere; }
        .count { display: inline-block; padding: 10px 16px; margin: 0 0 24px; background: #e2edff; border-radius: 8px; color: #163d77; font-weight: 600; }
        .table-wrap { overflow-x: auto; background: white; border: 1px solid #d4deec; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        caption { padding: 16px 20px; text-align: left; font-weight: 600; }
        th, td { padding: 14px 20px; border-top: 1px solid #dce4ef; }
        th { background: #edf2f8; white-space: nowrap; }
        td { overflow-wrap: anywhere; }
        tbody tr:nth-child(even) { background: #f8fafd; }
        .phone { white-space: nowrap; }
        .empty { padding: 40px 20px; text-align: center; color: #52657e; }
        @media (max-width: 600px) { main { margin: 24px auto; padding: 0 12px; } th, td { padding: 12px; } }
    </style>
</head>
<body>
<main>
    <p class="label">活動報名清單</p>
    <h1>{{ activity.title }}</h1>
    <p class="count">目前報名人數：{{ registration_count }} 人</p>
    <div class="table-wrap">
        <table>
            <caption>報名者資料</caption>
            <thead>
                <tr>
                    <th scope="col">報名者編號</th>
                    <th scope="col">報名者姓名</th>
                    <th scope="col">聯絡電話</th>
                </tr>
            </thead>
            <tbody>
            {% for registration in registrations %}
                <tr>
                    <td>{{ registration.id }}</td>
                    <td>{{ registration.name }}</td>
                    <td class="phone">{{ registration.phone }}</td>
                </tr>
            {% else %}
                <tr><td colspan="3" class="empty">目前尚無報名資料</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
